services:
  backend:
    build:
      context: ./backend
      target: runtime
    env_file:
      - path: ./backend/.env
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # docker compose run --rm test
  test:
    build:
      context: ./backend
      target: test
    profiles: [tools]
    network_mode: none

  # docker compose run --rm train   (downloads NHANES into backend/data, rewrites the artifact)
  train:
    build:
      context: ./backend
      target: test
    profiles: [tools]
    network_mode: bridge
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./backend:/app
    environment:
      - OMP_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
    command: sh -c "python -m ml.download data && python -m ml.train --data data"

# A fixed subnet: Docker's default pools can run out on machines with many projects.
networks:
  default:
    ipam:
      config:
        - subnet: ${DEATHNOTE_SUBNET:-10.213.47.0/24}
